name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (numpy, OpenCV)
        run: python -m pip install numpy opencv-python-headless
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Dependency check tool runs
        run: python scripts/kk_doctor.py
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Manifest is valid JSON with required fields
        run: python -c "import json;d=json.load(open('.claude-plugin/plugin.json',encoding='utf-8'));assert d['name'] and d['version'] and d['license']=='MIT'"
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Personal paths, emails and key-like strings (files + history)
        run: |
          PATTERN='[A-Za-z]:[\\/]+Users|/home/[a-z]|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}|(^|[^A-Za-z0-9])(sk-|ghp_|github_pat_|AIza|xox[bp]-|AKIA)[A-Za-z0-9_-]{16,}'
          set +e
          for c in $(git rev-list --all); do
            git grep -nIE "$PATTERN" "$c" -- .
            rc=$?
            if [ $rc -eq 0 ]; then echo "personal data or key-like string in $c"; exit 1; fi
            if [ $rc -ne 1 ]; then echo "git grep error rc=$rc"; exit 1; fi
          done
          echo clean
      - name: Every commit author is the project identity
        run: |
          others=$(git log --all --no-merges --format='%an,%ae' | sort -u | grep -vx 'msamkari,msamkari@users\.noreply\.github\.com' || true)
          if [ -n "$others" ]; then echo "unexpected commit author:"; echo "$others"; exit 1; fi
          if git log --all --no-merges --format=%B | grep -qiE 'co-authored-by|claude\.ai/code|generated with'; then echo "trailer or session link in a commit message"; exit 1; fi
          echo clean
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: License is permissive and matches the LICENSE file
        run: |
          lic=$(node -p "require('./.claude-plugin/plugin.json').license")
          case "$lic" in MIT) pat='MIT License';; Apache-2.0) pat='Apache License';; BSD-2-Clause|BSD-3-Clause) pat='BSD';; *) echo "license '$lic' needs review"; exit 1;; esac
          grep -qi "$pat" LICENSE || { echo "LICENSE does not look like $lic"; exit 1; }
      - name: Third-party dependency licences are permissive (read from installed metadata)
        run: |
          python -m pip install numpy opencv-python-headless
          python - <<'PY'
          from importlib import metadata as m
          for n in ("numpy", "opencv-python-headless"):
              md = m.metadata(n)
              lic = (md.get("License-Expression") or md.get("License") or "") + " " + " ".join(c for c in (md.get_all("Classifier") or []) if "License" in c)
              print(n, m.version(n), "->", lic.strip()[:120])
              if not any(k in lic for k in ("BSD", "MIT", "Apache")) or "GPL" in lic.replace("LGPL", ""):
                  raise SystemExit("review the licence of " + n)
          PY
          echo "ffmpeg is an external program, not bundled; its licence depends on the build and is documented in the README"
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@2.1.316 plugin validate .
